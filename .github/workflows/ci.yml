name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # clientul prisma trebuie generat inainte de tsc
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run lint
      - run: npm run typecheck
